<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Vibes — Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg" id="bg">
    <div class="moon"></div>
    <div class="skyline"></div>
  </div>

  <div class="app">

    <div class="sidebar" id="sidebar">
      <div class="brand">✦ Anime Vibes</div>
    </div>

    <div class="main">

      <div class="now-playing">
        <div class="vinyl-wrap">
          <svg class="arm" id="arm" viewBox="0 0 100 100">
            <circle cx="88" cy="12" r="7" fill="#2a2540" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>
            <rect x="20" y="10" width="66" height="5" rx="2.5" fill="#2a2540" transform="rotate(35 88 12)"/>
          </svg>
          <div class="vinyl" id="vinyl">
            <svg width="100%" height="100%" viewBox="0 0 190 190">
              <defs>
                <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#2a2440"/>
                  <stop offset="70%" stop-color="#15111f"/>
                  <stop offset="100%" stop-color="#0c0a14"/>
                </radialGradient>
              </defs>
              <circle cx="95" cy="95" r="95" fill="url(#discGrad)"/>
              <circle cx="95" cy="95" r="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
              <circle cx="95" cy="95" r="65" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
              <circle cx="95" cy="95" r="50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
            </svg>
            <div class="label" id="vinylLabel">♪</div>
            <div class="hole"></div>
          </div>
        </div>

        <div class="np-info">
          <span class="np-cat" id="npCat">Категория</span>
          <div class="np-title" id="npTitle">Название трека</div>
          <div class="np-artist" id="npArtist">Исполнитель</div>

          <div class="progress-row">
            <span class="time" id="curTime">0:00</span>
            <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
            <span class="time" id="durTime">0:00</span>
          </div>

          <div class="controls">
            <button class="ctrl-btn" id="shuffleBtn" title="Случайный порядок">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.42 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button class="ctrl-btn" id="prevBtn" title="Предыдущий">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn" id="playBtn" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" title="Следующий">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
            </button>
            <button class="ctrl-btn" id="repeatBtn" title="Повторять трек">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>

            <div class="volume-row">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 15 8.5v7a4.5 4.5 0 0 0 1.5-3.5z"/></svg>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
            </div>
          </div>
        </div>
      </div>

      <div class="playlist-panel">
        <div class="playlist-header">
          <h2 id="plHeader">Категория</h2>
          <span id="plCount">0 треков</span>
        </div>
        <div class="playlist" id="playlist"></div>
      </div>

    </div>
  </div>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
